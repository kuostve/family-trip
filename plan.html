<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2027 新山過年・家族行程投票</title>
<style>
  :root{
    --sand:#fdf6ec; --card:#fff; --ink:#243b40; --sub:#6b8490; --sea:#0e7c86; --sea-d:#0a5c64;
    --foam:#e6f4f4; --coral:#ff7a59; --sun:#ffc861; --ok:#2fa36b;
    --shadow:0 6px 22px rgba(20,70,80,.08); --shadow-s:0 2px 10px rgba(20,70,80,.07);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--sand);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.6}
  img{display:block;width:100%}
  a{color:var(--sea)}
  .wrap{max-width:520px;margin:0 auto;padding:0 0 120px}
  /* hero */
  .hero{position:relative;background:linear-gradient(160deg,#0e7c86,#0a5c64 55%,#08474e);color:#fff;padding:30px 20px 26px;border-radius:0 0 26px 26px;overflow:hidden}
  .hero:after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.08)}
  .hero .kick{font-size:13px;letter-spacing:.14em;opacity:.85;margin:0 0 8px}
  .hero h1{font-size:27px;line-height:1.3;margin:0 0 10px;font-weight:700}
  .hero p{margin:0;font-size:15px;opacity:.94}
  .hero .date{display:inline-block;margin-top:14px;background:rgba(255,255,255,.16);border-radius:99px;padding:6px 14px;font-size:14px}
  /* sections */
  section{padding:0 16px}
  h2.sec{font-size:20px;margin:30px 0 4px;display:flex;align-items:center;gap:8px}
  h2.sec .n{font-size:13px;font-weight:600;color:#fff;background:var(--sea);border-radius:99px;padding:2px 9px;letter-spacing:.06em}
  p.sub{color:var(--sub);font-size:14px;margin:0 0 14px}
  .card{background:var(--card);border-radius:18px;box-shadow:var(--shadow-s);padding:16px}
  .summary{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:18px;margin-top:-18px;position:relative}
  .summary h3{margin:0 0 8px;font-size:16px;color:var(--sea-d)}
  .summary ul{margin:0;padding-left:20px;font-size:15px}
  .summary li{margin:3px 0}
  /* timeline */
  .tl{margin-top:8px}
  .tl .item{display:flex;gap:12px;padding:0 0 16px}
  .tl .dot{flex:0 0 34px;height:34px;border-radius:50%;background:var(--foam);color:var(--sea-d);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
  .tl .body{background:#fff;border-radius:16px;box-shadow:var(--shadow-s);padding:13px 15px;flex:1}
  .tl .body b{font-size:16px}
  .tl .body .d{font-size:13px;color:var(--sub);margin-left:6px;font-weight:400}
  .tl .body p{margin:6px 0 0;font-size:14.5px;color:#3f5560}
  .tl .body .split{display:inline-block;margin-top:8px;font-size:13px;background:#fff3ec;color:#c2410c;border-radius:99px;padding:3px 10px}
  /* question */
  .q{margin-top:8px}
  .q .qtitle{display:flex;align-items:baseline;gap:8px;margin:0 0 2px}
  .q .qtitle h3{margin:0;font-size:18px}
  .q .qtitle span{font-size:13px;color:var(--sub)}
  .strip{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 16px 16px;margin:0 -16px;-webkit-overflow-scrolling:touch}
  .strip::-webkit-scrollbar{height:0}
  .opt{flex:0 0 84%;max-width:330px;scroll-snap-align:center;background:#fff;border-radius:20px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;border:2px solid transparent}
  .opt.sel{border-color:var(--sea);box-shadow:0 8px 26px rgba(14,124,134,.22)}
  .opt .pic{position:relative;aspect-ratio:16/10;background:#dfe9ea}
  .opt .pic img{width:100%;height:100%;object-fit:cover}
  .opt .lvl{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.55);color:#fff;border-radius:99px;padding:3px 10px;font-size:12px}
  .opt .pic .src{position:absolute;right:8px;bottom:6px;font-size:10px;color:#fff;background:rgba(0,0,0,.45);border-radius:6px;padding:1px 6px;text-decoration:none}
  .opt .in{padding:14px 15px 16px;display:flex;flex-direction:column;flex:1}
  .opt h4{margin:0 0 6px;font-size:17px;line-height:1.35}
  .opt .price{font-size:15px;font-weight:700;color:var(--sea-d);margin:0 0 2px}
  .opt .price small{font-weight:400;color:var(--sub);font-size:12.5px;display:block}
  .opt ul{margin:10px 0 0;padding-left:19px;font-size:14.5px}
  .opt ul li{margin:3px 0}
  .opt .who{margin:10px 0 0;font-size:13.5px;background:var(--foam);color:var(--sea-d);border-radius:10px;padding:7px 10px}
  .opt .tips{margin:10px 0 0;font-size:13.5px;color:#4a6068}
  .opt .tips div{margin:5px 0}
  .opt .warn{margin:10px 0 0;font-size:13.5px;color:#c2410c;background:#fff7f0;border-radius:10px;padding:8px 10px}
  .opt .votes{margin:12px 0 0;font-size:13px;color:var(--sub)}
  .opt .votes b{color:var(--coral)}
  .opt .pick{margin-top:12px;width:100%;border:0;border-radius:14px;padding:13px;font-size:16px;font-weight:700;font-family:inherit;background:var(--foam);color:var(--sea-d);cursor:pointer}
  .opt.sel .pick{background:var(--sea);color:#fff}
  .swipe{font-size:12.5px;color:var(--sub);text-align:right;margin:-10px 0 0}
  /* calendar */
  .cal{overflow-x:auto;background:#fff;border-radius:18px;box-shadow:var(--shadow-s);padding:12px}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{text-align:center;padding:4px 2px;white-space:nowrap}
  th.nm{text-align:left;padding-right:8px;font-weight:600}
  td.c{cursor:pointer;width:26px}
  td.c i{display:block;width:22px;height:22px;border-radius:6px;background:#f1f5f5;margin:0 auto}
  td.c.on i{background:var(--sea)}
  tr.me td.nm{color:var(--sea-d)}
  .legend{font-size:12.5px;color:var(--sub);margin:8px 0 0}
  /* submit */
  .form{margin-top:12px}
  .form label{font-size:14px;color:var(--sub);display:block;margin-bottom:6px}
  input[type=text]{width:100%;font-size:16px;padding:13px;border-radius:14px;border:2px solid #e3eeee;background:#fff;font-family:inherit}
  input[type=text]:focus{outline:none;border-color:var(--sea)}
  .bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);box-shadow:0 -4px 20px rgba(20,70,80,.10);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
  .bar .inner{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .bar .cnt{font-size:13px;color:var(--sub);flex:0 0 auto}
  .bar button{flex:1;border:0;border-radius:16px;padding:15px;font-size:17px;font-weight:700;font-family:inherit;background:var(--sea);color:#fff;cursor:pointer}
  .bar button:disabled{background:#c7d8da}
  .done{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:22px;text-align:center;margin-top:16px}
  .done .big{font-size:52px}
  .done h3{margin:6px 0;font-size:19px}
  .done p{margin:0;color:var(--sub);font-size:14.5px}
  .also{display:block;text-align:center;margin:18px 0 0;color:var(--sub);font-size:14px}
  .note{font-size:12.5px;color:var(--sub);margin:22px 0 0;text-align:center}
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <p class="kick">2027 過年・家族旅行</p>
    <h1 id="h1">新山＋迪沙魯，<br>一起去投票</h1>
    <p id="hs">問卷大家都填完了，接下來換你選。</p>
    <span class="date" id="hd">2027/2/2–2/13・10 個人</span>
  </div>

  <section>
    <div class="summary">
      <h3>問卷結果一句話</h3>
      <p id="sum" style="margin:0 0 8px;font-size:15px"></p>
      <ul id="sumul"></ul>
    </div>
  </section>

  <section>
    <h2 class="sec"><span class="n">行程骨架</span>大概這樣走</h2>
    <p class="sub" id="skeletonSub"></p>
    <div class="tl" id="tl"></div>
  </section>

  <section id="voteArea">
    <h2 class="sec"><span class="n">投票</span>選你想要的</h2>
    <p class="sub">每一題左右滑，看完再按「投這個」。可以只投有想法的題目，投完按最下面的送出。</p>
    <div id="qs"></div>
    <div class="form card" style="margin-top:18px">
      <label>你的稱呼（同一人重投以最後一次為準）</label>
      <input type="text" id="name" placeholder="例如：提夫、xo、老爸、阿媽、乃瑜、卞" maxlength="20">
    </div>
    <a class="also" href="./results.html">看問卷「大家的答案」→</a>
  </section>

  <div id="doneBox"></div>

  <p class="note">資料來源：官網、訂房網站與公開社群貼文，每張卡片下方標有來源。<br>價格為查證當時的參考值（非 2027 過年實際報價），下單前請再確認。</p>
</div>

<div class="bar" id="bar"><div class="inner">
  <span class="cnt" id="cnt">已選 0 題</span>
  <button id="send">送出我的投票</button>
</div></div>

function head(){
  $('#h1').innerHTML=esc(DATA.title||'新山＋迪沙魯，一起去投票');
  $('#hs').textContent=DATA.subtitle||'';
  $('#hd').textContent=DATA.dates||'';
  $('#sum').textContent=DATA.summary||'';
  $('#sumul').innerHTML=(DATA.summaryPoints||[]).map(t=>`<li>${esc(t)}</li>`).join('');
  $('#skeletonSub').textContent=DATA.skeletonHint||'';
  $('#tl').innerHTML=(DATA.skeleton||[]).map((d,i)=>`
    <div class="item"><div class="dot">${esc(d.tag||('D'+(i+1)))}</div>
    <div class="body"><b>${esc(d.title)}</b><span class="d">${esc(d.date||'')}</span>
    ${d.text?`<p>${d.text}</p>`:''}${d.split?`<span class="split">🔀 ${esc(d.split)}</span>`:''}</div></div>`).join('');
}
function picture(o){
  if(!o.img) return `<div class="pic"></div>`;
  const src=o.imgSrc&&o.imgSrc.url?`<a class="src" target="_blank" rel="noopener" href="${esc(o.imgSrc.url)}">圖：${esc(o.imgSrc.label||'來源')}</a>`:'';
  return `<div class="pic"><img loading="lazy" src="${esc(o.img)}" alt="${esc(o.name)}" onerror="this.parentNode.style.display='none'">${o.level?`<span class="lvl">${esc(o.level)}</span>`:''}${src}</div>`;
}
function cards(){
  $('#qs').innerHTML=(DATA.questions||[]).map((q,qi)=>{
    const opts=(q.options||[]).map((o,oi)=>{
      const tips=(o.tips||[]).map(t=>t.u?`<div>💬 ${esc(t.t)} <a href="${esc(t.u)}" target="_blank" rel="noopener">看心得</a></div>`:`<div>💬 ${esc(t.t)}</div>`).join('');
      return `<div class="opt" id="o-${q.id}-${o.key}">
        ${picture(o)}
        <div class="in">
          <h4>${esc(o.name)}</h4>
          <p class="price">${esc(o.price||'')}${o.priceNote?`<small>${esc(o.priceNote)}</small>`:''}</p>
          <ul>${(o.highlights||[]).map(h=>`<li>${esc(h)}</li>`).join('')}</ul>
          ${o.who?`<p class="who">👨‍👩‍👧‍👦 ${esc(o.who)}</p>`:''}
          ${tips?`<div class="tips">${tips}</div>`:''}
          ${o.warn?`<p class="warn">⚠️ ${esc(o.warn)}</p>`:''}
          <p class="votes" id="v-${q.id}-${o.key}"></p>
          <button class="pick" data-q="${q.id}" data-k="${o.key}">投這個</button>
        </div></div>`}).join('');
    return `<div class="q"><div class="qtitle"><h3>${qi+1}. ${esc(q.title)}</h3><span>${esc(q.hint||'')}</span></div>
      ${q.note?`<p class="sub" style="margin:0 0 4px">${esc(q.note)}</p>`:''}
      <div class="strip">${opts}</div>
      <p class="swipe">左右滑看其他選項 →</p></div>`}).join('');
  document.querySelectorAll('.pick').forEach(b=>b.onclick=()=>{
    const q=b.dataset.q,k=b.dataset.k;
    if(A.votes[q]===k) delete A.votes[q]; else A.votes[q]=k;
    paint(); count();
  });
}
function cal(){
  if(!DATA.calendar) return;
  const d=DATA.calendar.days||[], people=DATA.calendar.people||[];
  const rows=people.map(p=>`<tr data-n="${esc(p)}"><td class="nm">${esc(p)}</td>`+
    d.map(x=>`<td class="c" data-d="${esc(x.k)}"><i></i></td>`).join('')+`</tr>`).join('');
  $('#qs').insertAdjacentHTML('beforeend',
    `<div class="q" id="calQ"><div class="qtitle"><h3>${DATA.questions.length+1}. 你哪幾天在？</h3><span>點格子</span></div>
     <p class="sub">先點自己的名字那一列（藍色），再點你會在新山／迪沙魯的日期；已經有人點過的會自動顯示。</p>
     <div class="cal"><table><thead><tr><th class="nm">誰</th>${d.map(x=>`<th>${esc(x.l).replace(/&lt;br&gt;/g,"<br>")}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>
     <p class="legend">藍色＝那天會在；初二 2/6 之後多數人還在。</p></div>`);
  document.querySelectorAll('tr[data-n]').forEach(tr=>tr.querySelectorAll('td.c').forEach(td=>td.onclick=()=>{
    A.name=A.name||$('#name').value.trim(); A.me=tr.dataset.n;
    document.querySelectorAll('#calQ tr').forEach(x=>x.classList.toggle('me',x.dataset.n===A.me));
    const day=td.dataset.d, i=A.days.indexOf(day);
    if(i<0) A.days.push(day); else A.days.splice(i,1);
    paintCal(); count();
  }));
}
function paintCal(){
  document.querySelectorAll('#calQ tr').forEach(tr=>{
    const me=tr.dataset.n, mine=A.me===me;
    tr.querySelectorAll('td.c').forEach(td=>{
      const d=td.dataset.d;
      let on=A.days.includes(d)&&mine;
      if(!mine) on=(DAYTALLY[me]||[]).includes(d);
      td.classList.toggle('on',on);
    });
  });
}
function paint(){
  document.querySelectorAll('.opt').forEach(el=>{
    const [q,k]=[el.id.split('-')[1],el.id.split('-').slice(2).join('-')];
    el.classList.toggle('sel',A.votes[q]===k);
    const b=el.querySelector('.pick'); if(b) b.textContent=A.votes[q]===k?'✓ 你投這個':'投這個';
  });
  (DATA.questions||[]).forEach(q=>(q.options||[]).forEach(o=>{
    const el=document.getElementById('v-'+q.id+'-'+o.key); if(!el) return;
    const names=(TALLY[q.id]||{})[o.key]||[];
    el.innerHTML=names.length?`目前 <b>${names.length}</b> 票：${esc(names.join('、'))}`:'還沒有人投';
  }));
}
function count(){
  const n=Object.keys(A.votes).length+(A.days.length||A.me?1:0);
  const total=(DATA.questions||[]).length+(DATA.calendar?1:0);
  $('#cnt').textContent=`已選 ${n} / ${total} 題`;
  $('#send').disabled=!(n>0&&$('#name').value.trim());
}
$('#name').oninput=()=>{A.name=$('#name').value.trim();count()};

/* ---------- 讀票數 ---------- */
function parseVotes(rows){
  const last={};
  (rows||[]).forEach(r=>{
    if(!String(r.text||'').startsWith('【投票】')) return;
    if(String(r.name).startsWith('測試')) return;      // 驗收用的測試票不算
    last[r.name]=r;
  });
  TALLY={}; DAYTALLY={};
  Object.values(last).forEach(r=>{
    const a=r.answers||{}, v=a.votes||{};
    Object.entries(v).forEach(([q,k])=>{
      TALLY[q]=TALLY[q]||{}; (TALLY[q][k]=TALLY[q][k]||[]).push(r.name);
    });
    if(a.days&&a.days.length) DAYTALLY[r.name]=a.days;
  });
  const names=Object.keys(last);
  $('#bar').dataset.n=names.length;
}
function load(){
  if(!ENDPOINT) return;
  fetch(ENDPOINT).then(r=>r.json()).then(j=>{parseVotes(j.rows);paint();paintCal()}).catch(()=>{});
}

/* ---------- 送出 ---------- */
function submit(){
  const name=$('#name').value.trim();
  if(!name) return $('#name').focus();
  A.name=name;
  const lines=Object.entries(A.votes).map(([q,k])=>{
    const Q=(DATA.questions||[]).find(x=>x.id===q); const o=(Q.options||[]).find(x=>x.key===k);
    return `・${Q.title}：${o?o.name:k}`;
  });
  if(A.days.length) lines.push(`・我在的日期：${A.days.slice().sort().map(x=>{const a=x.split('-');return parseInt(a[1],10)+'/'+parseInt(a[2],10)}).join('、')}${A.me?`（${A.me}）`:''}`);
  const text=`【投票】${name}\n`+lines.join('\n');
  const body=JSON.stringify({name,fam:'行程投票',text,answers:{kind:'vote',votes:A.votes,days:A.days,me:A.me||''}});
  $('#send').disabled=true; $('#send').textContent='送出中⋯';
  fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body})
    .then(r=>r.text()).then(t=>{
      if(t.trim()!=='ok') throw 0;
      $('#doneBox').innerHTML=`<div class="done"><div class="big">🎉</div><h3>投好了，謝謝 ${esc(name)}！</h3>
        <p>你的票已經存進去，下面會即時顯示大家的票數。</p><pre id="my" style="text-align:left;white-space:pre-wrap;font-family:inherit;font-size:14px;background:#f7fbfb;border-radius:12px;padding:12px;margin:14px 0 0">${esc(text)}</pre></div>`;
      $('#send').textContent='再送一次'; $('#send').disabled=false;
      load();
      $('#doneBox').scrollIntoView({behavior:'smooth',block:'center'});
    }).catch(()=>{
      $('#send').textContent='沒送出，再試一次'; $('#send').disabled=false;
      $('#doneBox').innerHTML=`<div class="done"><div class="big">⚠️</div><h3>沒有送出成功</h3><p>可能是網路不穩，請再按一次「送出我的投票」。</p></div>`;
    });
}
$('#send').onclick=submit;

head(); cards(); cal(); paint(); count(); load();
</script>
</body>
</html>
