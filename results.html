<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大家的答案・2027 新山過年</title>
<style>
  :root{--bg:#fff8ef;--ink:#2b2b2b;--sub:#7a7066;--acc:#ff7a45}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
  h1{font-size:24px;margin:0 0 4px}
  .sub{color:var(--sub);font-size:14px;margin:0 0 18px}
  .card{background:#fff;border-radius:16px;padding:14px 16px;margin:12px 0;box-shadow:0 1px 3px #0001}
  .card h3{margin:0 0 6px;font-size:17px}
  .card small{color:var(--sub);font-weight:400;font-size:12px;margin-left:6px}
  pre{white-space:pre-wrap;font-family:inherit;font-size:14px;line-height:1.6;margin:0}
  .tally div{display:flex;align-items:center;gap:8px;font-size:14px;margin:4px 0}
  .tally b{display:inline-block;height:12px;background:var(--acc);border-radius:6px}
  a.btn{display:block;text-align:center;margin-top:20px;padding:14px;border-radius:14px;background:var(--acc);color:#fff;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <h1>大家的答案 🇲🇾🧧</h1>
  <p class="sub" id="sub">載入中⋯</p>
  <div id="tally"></div>
  <div id="list"></div>
  <a class="btn" href="./">我還沒填 → 去填問卷</a>
</div>
<script>
const ENDPOINT='https://script.google.com/macros/s/AKfycbxnKGlB0GbRlPYoNljLPUZcbxWNN1htLBf37LVHWDAYSjVT813_eFzJaz64uAW5J5xD1Q/exec';
const ACTS={lego:'樂高樂園',indoor:'室內樂園',water:'水上樂園',beach:'海邊度假村',sg:'新加坡一日',seafood:'漁村海鮮',local:'在地小吃',shop:'Outlet／商場',oldtown:'老街廟宇',spa:'按摩',farm:'農場螢火蟲',diy:'料理手作'};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
if(!ENDPOINT){$('#sub').textContent='還沒接上試算表。'}
else fetch(ENDPOINT).then(r=>r.json()).then(({rows})=>{
  const last={}; rows.filter(r=>!String(r.name).startsWith('測試')).forEach(r=>last[r.name]=r);  // 同一個人填兩次，只算最後一次
  const L=Object.values(last).sort((a,b)=>new Date(b.time)-new Date(a.time));
  $('#sub').textContent=L.length?`已經有 ${L.length} 個人填了`:'還沒有人填，當第一個吧！';
  const c={}; L.forEach(r=>(r.answers.acts||[]).forEach(k=>c[k]=(c[k]||0)+1));
  const top=Object.entries(c).sort((a,b)=>b[1]-a[1]);
  if(top.length) $('#tally').innerHTML='<div class="card tally"><h3>大家最想做</h3>'+top.map(([k,n])=>`<div><span style="width:7em">${ACTS[k]||k}</span><b style="width:${n*24}px"></b>${n}</div>`).join('')+'</div>';
  $('#list').innerHTML=L.map(r=>`<div class="card"><h3>${esc(r.name)}<small>${esc(r.fam)}・${new Date(r.time).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</small></h3><pre>${esc(r.text.split('\n').slice(1).filter(x=>x&&!x.startsWith('#')).join('\n'))}</pre></div>`).join('');
}).catch(()=>$('#sub').textContent='讀取失敗，等一下再重新整理看看。');
</script>
</body>
</html>
