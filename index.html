<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>2027 過年・新山家族旅行小問卷</title>
<style>
  :root{--bg:#fff8ef;--card:#fff;--ink:#2b2b2b;--sub:#7a7066;--acc:#ff7a45;--acc2:#ffd3bf;--ok:#2fa36b}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
  .wrap{width:100%;max-width:460px;padding:18px 16px 40px;flex:1;display:flex;flex-direction:column}
  .bar{height:8px;background:#f0e3d6;border-radius:99px;overflow:hidden;margin:4px 0 6px}
  .bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
  .meta{display:flex;justify-content:space-between;color:var(--sub);font-size:13px;min-height:20px}
  .meta button{background:none;border:0;color:var(--sub);font-size:13px;padding:0;cursor:pointer}
  .q{flex:1;display:flex;flex-direction:column;justify-content:center;animation:in .25s ease}
  @keyframes in{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
  h1{font-size:26px;margin:0 0 10px}
  h2{font-size:22px;margin:0 0 6px;line-height:1.35}
  .hint{color:var(--sub);font-size:14px;margin:0 0 18px}
  .duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .opt{background:var(--card);border:2px solid transparent;border-radius:18px;padding:18px 10px;text-align:center;font-size:16px;cursor:pointer;box-shadow:0 2px 8px rgba(120,80,40,.08);transition:transform .1s,border-color .15s;color:var(--ink);font-family:inherit}
  .opt:active{transform:scale(.96)}
  .opt .e{font-size:40px;display:block;margin-bottom:6px}
  .duo .opt{padding:28px 10px}
  .duo .opt .e{font-size:52px}
  .grid .opt{padding:14px 8px;font-size:15px}
  .grid .opt .e{font-size:30px}
  .opt.on{border-color:var(--acc);background:#fff3ec}
  .opt.no.on{border-color:#777;background:#f1f1f1}
  .mid{grid-column:1/-1;background:none;box-shadow:none;color:var(--sub);font-size:14px;padding:8px}
  input[type=text],textarea{width:100%;font-size:17px;padding:14px;border-radius:14px;border:2px solid #eadccc;background:#fff;font-family:inherit}
  textarea{min-height:110px;resize:vertical}
  input:focus,textarea:focus{outline:none;border-color:var(--acc)}
  .btn{display:block;width:100%;margin-top:16px;padding:16px;border:0;border-radius:16px;background:var(--acc);color:#fff;font-size:18px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn:disabled{opacity:.4}
  .btn.line{background:#06c755}
  .btn.ghost{background:#fff;color:var(--ink);border:2px solid #eadccc}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .chip{background:var(--acc2);border-radius:99px;padding:4px 10px;font-size:13px}
  pre{white-space:pre-wrap;background:#fff;border-radius:14px;padding:14px;font-size:14px;line-height:1.6;font-family:inherit;margin:0}
  .center{text-align:center}
  .big{font-size:64px;margin-bottom:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><i id="bar"></i></div>
  <div class="meta"><button id="back" style="visibility:hidden">‹ 上一題</button><span id="step"></span></div>
  <div id="stage" class="q"></div>
</div>

<script>
// 每題：type duo＝二選一（可「都可以」）、pick＝單選格子、multi＝多選（max）、text＝自由填
const ACTS=[
  ['lego','🧱','樂高樂園'],['indoor','🎠','室內樂園\n親子館'],['water','🌊','水上樂園'],['beach','🏖️','海邊度假村\n（迪沙魯）'],
  ['sg','🇸🇬','去新加坡\n玩一天'],['seafood','🦐','漁村吃海鮮'],['local','🍜','在地小吃\n早餐、茶室'],['shop','🛍️','Outlet／商場'],
  ['oldtown','🏮','老街、廟宇\n過年氣氛'],['spa','💆','按摩放鬆'],['farm','🍍','農場、螢火蟲\n大自然'],['diy','👩‍🍳','料理／手作\n體驗']
];
const isKid=()=>A.fam!=='elder'&&A.age==='kid';
const Q=[
  {id:'name',type:'text',title:'先說你是誰 😊',hint:'寫稱呼就好，例如：阿公、小美',ph:'你的稱呼',req:true},
  {id:'fam',type:'pick',title:'你是哪一家的？',opts:[['elder','👴👵','爸媽'],['bro','🏠','姐夫家'],['tf','🏡','提夫家']]},
  {id:'age',type:'pick',title:'你是？',hint:'小朋友也可以自己填喔！',show:()=>A.fam!=='elder',opts:[['adult','🧑','大人'],['kid','🧒','小朋友']]},
  {id:'pace',type:'duo',title:'旅行的節奏？',a:['slow','🐢','慢慢玩\n一天一兩個點'],b:['fast','🐇','多跑幾個點\n不要浪費時間']},
  {id:'wake',type:'duo',title:'早上？',show:()=>!isKid(),a:['early','🌅','早起出發\n趁涼快'],b:['sleep','🛌','睡飽\n再出門']},
  {id:'heat',type:'pick',title:'馬來西亞很熱，你可以嗎？',hint:'二月白天大約 31°C',opts:[['hot','🥵','很怕熱\n中午要待室內'],['mid','🙂','普通'],['ok','😎','不怕熱']]},
  {id:'acts',type:'multi',max:3,title:'在新山最想做的事？',hint:'最多選 3 個',opts:ACTS},
  {id:'must',type:'pick',title:'如果只能選一件「一定要做」？',opts:ACTS},
  {id:'never',type:'pick',title:'有沒有「不太想做」的？',opts:[...ACTS,['none','👌','都可以']],no:true},
  {id:'split',type:'duo',title:'可以偶爾分頭玩嗎？',hint:'去年泰國有過：小孩去樂園，大人喝咖啡、按摩',show:()=>!isKid(),a:['together','👨‍👩‍👧‍👦','盡量\n全家一起'],b:['split','🔀','分頭玩\n也很好']},
  {id:'stay',type:'duo',title:'住的地方？',show:()=>!isKid(),a:['resort','🏝️','住度假村\n有泳池、可以放空'],b:['city','🏙️','住市區\n吃飯逛街方便']},
  {id:'cny',type:'pick',title:'過年那幾天想怎麼過？',hint:'除夕 2/5、初一 2/6',show:()=>!isKid(),opts:[['join','🧧','跟著體驗\n當地華人過年'],['dinner','🍲','一起吃團圓飯\n其他自己玩'],['any','🤷','都可以']]},
  {id:'days',type:'pick',title:'全家一起玩，你想玩幾天？',hint:'姐夫家：你們回新山期間，大概能一起出去玩幾天？',show:()=>!isKid(),opts:[['d3','3️⃣','3–4 天'],['d5','5️⃣','5–6 天'],['d7','7️⃣','7 天以上'],['any','🤷','都可以']]},
  {id:'stayon',type:'pick',title:'要不要在新山多留 1–2 天，去姐夫家走走？',hint:'只問爸媽',show:()=>A.fam==='elder',opts:[['yes','🏠','好，多留\n1–2 天'],['no','✈️','跟大家\n一起回'],['maybe','🤔','再看看']]},
  {id:'date',type:'pick',title:'提夫家什麼時候去比較好？',hint:'只能請 2 天假，春節連假是 2/4–2/10',show:()=>A.fam==='tf'&&!isKid(),opts:[['early','🅰️','2/2–2/10（9 天）\n請 2/2、2/3'],['late','🅱️','2/4–2/13（10 天）\n請 2/11、2/12\n可跟姐夫家一起回'],['any','🤷','都可以']]},
  {id:'note',type:'text',long:true,title:'還有什麼想說的？',hint:'可跳過。例如：想吃什麼、去年泰國最喜歡哪一段、會暈車……',ph:'（可以不填）'}
];
// 填答紀錄存到提夫的 Google 試算表（Apps Script 網頁應用程式網址）；空的就只用 LINE
const ENDPOINT='https://script.google.com/macros/s/AKfycbxnKGlB0GbRlPYoNljLPUZcbxWNN1htLBf37LVHWDAYSjVT813_eFzJaz64uAW5J5xD1Q/exec';
const A={}; let i=-1;
const $=s=>document.querySelector(s), stage=$('#stage');
const lab=(list,k)=>{const o=list.find(x=>x[0]===k);return o?o[2].replace(/\n/g,' '):k};

function intro(){
  stage.innerHTML=`<div class="center"><div class="big">🇲🇾🧧</div><h1>2027 過年・新山見！</h1>
  <p class="hint">2027/2/2–2/13，全家 10 個人一起去馬來西亞新山。<br>幫忙填一下，大概 2 分鐘，全部用點的，小朋友也可以自己填。<br>大家的答案會整理成最適合全家的行程。</p>
  <button class="btn" id="go">開始</button>
  <a href="results.html" style="display:block;margin-top:14px;color:var(--sub);font-size:14px">看大家的答案 →</a></div>`;
  $('#go').onclick=()=>go(0); upd();
}
function upd(){
  $('#bar').style.width=(i<0||i>=Q.length?(i<0?0:100):(Q.filter(vis).indexOf(Q[i])/Q.filter(vis).length)*100)+'%';
  const V=Q.filter(vis); $('#step').textContent=i>=0&&i<Q.length?`${V.indexOf(Q[i])+1} / ${V.length}`:'';
  $('#back').style.visibility=i>0&&i<=Q.length?'visible':'hidden';
}
const vis=q=>!q.show||q.show();
function go(n,dir=1){while(n>=0&&n<Q.length&&!vis(Q[n])) n+=dir; i=Math.max(0,n); if(i>=Q.length) return done(); render(Q[i]); upd(); scrollTo(0,0)}
const next=()=>setTimeout(()=>go(i+1),180);
$('#back').onclick=()=>go(Math.max(0,i-1),-1);

function opt(o,on,cls=''){return `<button class="opt ${cls}${on?' on':''}" data-k="${o[0]}"><span class="e">${o[1]}</span>${o[2].replace(/\n/g,'<br>')}</button>`}

function render(q){
  let h=`<h2>${q.title}</h2>${q.hint?`<p class="hint">${q.hint}</p>`:'<p class="hint"></p>'}`;
  if(q.type==='text'){
    h+=q.long?`<textarea id="t" placeholder="${q.ph}">${A[q.id]||''}</textarea>`:`<input type="text" id="t" placeholder="${q.ph}" value="${(A[q.id]||'').replace(/"/g,'&quot;')}" maxlength="20">`;
    h+=`<button class="btn" id="ok">${q.long?'完成':'下一題'}</button>`;
    stage.innerHTML=h; const t=$('#t'), ok=$('#ok');
    const chk=()=>ok.disabled=q.req&&!t.value.trim(); chk(); t.oninput=chk;
    if(!q.long) t.onkeydown=e=>{if(e.key==='Enter'&&!ok.disabled) ok.click()};
    ok.onclick=()=>{A[q.id]=t.value.trim(); next()};
    if(!q.long) t.focus();
    return;
  }
  if(q.type==='duo'){
    h+=`<div class="duo">${opt(q.a,A[q.id]==q.a[0])}${opt(q.b,A[q.id]==q.b[0])}<button class="opt mid${A[q.id]=='any'?' on':''}" data-k="any">都可以 🤷</button></div>`;
  } else if(q.type==='pick'){
    h+=`<div class="grid">${q.opts.map(o=>opt(o,A[q.id]==o[0],q.no?'no':'')).join('')}</div>`;
  } else if(q.type==='multi'){
    const cur=A[q.id]||[];
    h+=`<div class="grid">${q.opts.map(o=>opt(o,cur.includes(o[0]))).join('')}</div><button class="btn" id="ok">下一題</button>`;
  }
  stage.innerHTML=h;
  stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;
    if(q.type==='multi'){
      let cur=A[q.id]||[];
      if(cur.includes(k)) cur=cur.filter(x=>x!==k); else if(cur.length<q.max) cur=[...cur,k];
      A[q.id]=cur; render(q); return;
    }
    stage.querySelectorAll('.opt').forEach(x=>x.classList.remove('on')); b.classList.add('on');
    A[q.id]=k; next();
  });
  if(q.type==='multi'){const ok=$('#ok'); ok.disabled=!(A[q.id]||[]).length; ok.onclick=next}
}

function summary(){
  const L=[`【2027 新山過年問卷】${A.name}`];
  for(const q of Q.slice(1)){
    if(!vis(q)) continue; const v=A[q.id]; if(v==null||v===''||(Array.isArray(v)&&!v.length)) continue;
    let s;
    if(q.type==='duo') s=v==='any'?'都可以':lab([q.a,q.b],v);
    else if(q.type==='multi') s=v.map(k=>lab(q.opts,k)).join('、');
    else if(q.type==='text') s=v;
    else s=lab(q.opts,v);
    const t=q.title.replace(/[？?😊]/g,'').replace(/^如果只能選一件「一定要做」$/,'一定要').replace(/^有沒有「不太想做」的$/,'不太想').replace(/^在新山最想做的事$/,'最想做').replace(/^提夫家什麼時候去比較好$/,'日期').replace(/^全家一起玩，你想玩幾天$/,'想玩幾天').replace(/^要不要在新山多留 1–2 天，去姐夫家走走$/,'多留拜訪姐夫家').replace(/^還有什麼想說的$/,'備註');
    L.push(`・${t}：${s}`);
  }
  const code=['JB27',...Q.map(q=>!vis(q)?'':Array.isArray(A[q.id])?A[q.id].join('+'):(q.type==='text'?'':(A[q.id]||'')))].join('|');
  L.push('','#'+code);
  return L.join('\n');
}
function save(s){
  if(!ENDPOINT) return Promise.resolve(false);
  const body=JSON.stringify({name:A.name,fam:lab(Q[1].opts,A.fam),text:s,answers:A});
  return fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body}).then(()=>true,()=>false);
}
function done(){
  i=Q.length; upd(); $('#bar').style.width='100%';
  const s=summary();
  stage.innerHTML=`<div class="center"><div class="big">🎉</div><h2>謝謝你！</h2>
  <p class="hint" id="st">${ENDPOINT?'正在存到網站⋯':'按下面的綠色按鈕，把結果傳到家族 LINE 群（或直接傳給提夫）。'}</p></div>
  <pre id="sum"></pre>
  <a class="btn" id="all" href="results.html" style="display:none;text-align:center;text-decoration:none">看大家的答案</a>
  <button class="btn line" id="line">用 LINE 傳出去</button>
  <button class="btn ghost" id="copy">複製文字</button>`;
  $('#sum').textContent=s;
  save(s).then(ok=>{ if(!ENDPOINT) return;
    $('#st').textContent=ok?'已經存到網站了 ✓ 不用再傳 LINE。':'沒存成功，請按綠色按鈕用 LINE 傳給提夫。';
    if(ok){$('#all').style.display='block';$('#line').className='btn ghost'}
  });
  $('#line').onclick=()=>location.href='https://line.me/R/share?text='+encodeURIComponent(s);
  $('#copy').onclick=async()=>{
    try{await navigator.clipboard.writeText(s)}catch(e){const r=document.createRange();r.selectNode($('#sum'));getSelection().removeAllRanges();getSelection().addRange(r);document.execCommand('copy')}
    $('#copy').textContent='已複製 ✓';
  };
}
intro();
</script>
</body>
</html>
